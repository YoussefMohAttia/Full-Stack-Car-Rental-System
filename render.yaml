services:
  - type: web
    name: car-rental-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DB_ENGINE
        value: sqlite
      - key: SQLITE_DATABASE
        value: data/car_rental.db
      - key: SECRET_KEY
        generateValue: true
